name: build-client

# Сборка VPNsky (клиент в app/) — Windows + Android.
#
# Почему свой workflow, а не upstream: в build.yaml FlClash проверки и сборка
# обёрнуты в условие `!github.event.repository.private`, поэтому в приватном
# репозитории они не запускаются вообще.
#
# Запуск: вкладка Actions → build-client → Run workflow.
# Результат: артефакты во вкладке Actions у соответствующего запуска.
#
# Секреты (Settings → Secrets and variables → Actions), все необязательные:
#   ANDROID_KEYSTORE_BASE64 — keystore.jks в base64
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Без них соберётся debug-APK (годится только для проверки, не для раздачи).

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Собрать Android'
        type: boolean
        default: true
      build_windows:
        description: 'Собрать Windows'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

defaults:
  run:
    working-directory: app

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/core/Clash.Meta/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      # GitHub Actions не даёт обращаться к secrets в if: — проверяем в shell.
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> android/local.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Секреты подписи не заданы — соберётся debug APK"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      # Важно: `flutter build apk` напрямую НЕ собирает Go-ядро (libclash).
      # Его собирает только setup.dart через хук плагина setup, поэтому
      # единственный правильный путь — всегда dart setup.dart android.
      # Если секретов подписи нет, gradle сам подпишет debug-ключом и добавит
      # суффикс .dev (см. android/app/build.gradle.kts: логика hasReleaseSigning).
      - name: Build APK
        run: |
          set -o pipefail
          dart setup.dart android --env stable -v 2>&1 | tee /tmp/build-android.log

      # Логи GitHub Actions лежат в хранилище, недоступном из среды разработки.
      # Поэтому при падении кладём хвост лога в ветку ci-logs — оттуда его видно.
      - name: Publish failure log
        if: failure()
        continue-on-error: true
        run: |
          tail -c 60000 /tmp/build-android.log > app-android.log 2>/dev/null || true
          bash .github/ci-log-push.sh android app-android.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpnsky-android
          path: |
            app/dist/*.apk
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          overwrite: true

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Enable git long paths
        run: git config --global core.longpaths true
        working-directory: .

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/core/Clash.Meta/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          dart setup.dart windows --env stable -v 2>&1 | tee build-windows.log

      - name: Publish failure log
        if: failure()
        continue-on-error: true
        shell: bash
        run: bash .github/ci-log-push.sh windows build-windows.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpnsky-windows
          path: app/dist/*
          if-no-files-found: error
          overwrite: true

  checksums:
    needs: [android, windows]
    if: ${{ always() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List and hash
        run: |
          ls -la ./dist
          cd ./dist
          find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined build
        uses: actions/upload-artifact@v4
        with:
          name: vpnsky-build-${{ github.run_number }}
          path: ./dist
          overwrite: true
